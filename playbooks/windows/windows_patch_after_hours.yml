      register: winrm_status
      retries: 40
      delay: 20
      until: winrm_status is success

    - name: Install Windows updates
      ansible.windows.win_updates:
        category_names:
          - SecurityUpdates
          - CriticalUpdates
          - UpdateRollups
          - DefinitionUpdates
          - Updates
        reboot: false
      register: update_install

    - name: Check reboot pending (post-patch)
      ansible.windows.win_shell: |
        if (
